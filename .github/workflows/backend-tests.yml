# รัน pytest ของ backend ทุก PR / push ที่แตะ web-portal/backend
# ไม่ต่อ SkyPilot / cluster / AWS จริง (ใช้ FakeSky) ต้องการแค่ Postgres สำหรับเทส
name: Backend tests

on:
  pull_request:
    paths:
      - "web-portal/backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "web-portal/backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: virtual_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virtual_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: web-portal/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-portal/backend/requirement.txt

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/virtual_lab_test
        run: pytest --color=yes
