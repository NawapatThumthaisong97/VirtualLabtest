# Production compose สำหรับเครื่อง webportal (100.98.10.101)
#
# ต่างจาก docker-compose.yml (dev) ตรงที่:
#   - รันครบทั้ง 3 service ไม่ใช่แค่ db
#   - db publish แค่ 127.0.0.1 (ให้ backend ที่ใช้ host network ต่อได้) ไม่ออกนอกเครื่อง
#   - ทุก port ผูกกับ BIND_IP (tailscale0) ไม่ใช่ 0.0.0.0
#   - backend ใช้ host network — ต้องเห็น IP จริงของเครื่องที่กด Start (ตัดสินว่าเป็นเครื่องแลปไหม)
#   - ค่า secret มาจาก .env ที่ Ansible render ไม่ใช่ hardcode
#
# ค่าใน .env ระดับนี้: BIND_IP, POSTGRES_*, VITE_API_URL (ดู .env.prod.example)

name: virtual-lab

services:
  db:
    image: postgres:17-alpine
    container_name: virtual_lab_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # loopback เท่านั้น — backend (host network) ต่อผ่าน 127.0.0.1 ข้างนอกเครื่องเข้าไม่ได้
    # ถ้าต้อง debug จากข้างนอกใช้ `docker compose exec db psql` แทนการเปิด port
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: virtual_lab_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    # app.main:lifespan เรียก sys.exit(1) ถ้าต่อ DB ไม่ได้
    # ถ้าไม่รอ db healthy ก่อน container จะตายตั้งแต่ start
    depends_on:
      db:
        condition: service_healthy

    volumes:
      # ไฟล์เอกสารแลปที่ผู้ใช้อัปโหลด (STORAGE_ROOT) — ต้อง persist ไว้นอก image
      # ไม่งั้น rebuild ทีไฟล์หายหมด
      - ./backend/storage:/app/storage
      # kubeconfig ที่ Ansible ดึงมาจาก master แล้วแก้ server เป็น Tailscale IP
      - ./backend/kubeconfig.yaml:/app/kubeconfig.yaml:ro
      # key ของ IAM user Skypilot-IAM (profile skypilot, AWS_PROFILE ใน .env) ใช้ขอ ECR token — Ansible render ให้
      - ./backend/aws-credentials:/root/.aws/credentials:ro

    # host network: request จาก tailnet เข้า backend ตรง ไม่ผ่าน NAT ของ docker / Tailscale
    # (ผ่าน bridge แล้ว Tailscale MASQUERADE packet ที่ forward จาก tailscale0 → backend เห็นทุกคนเป็น
    # 172.18.0.1 ทุกการกด Start ไป AWS หมด — เจอ 2026-10-23 ดู docs/LAB_DIRECT_POD.md)
    # ผูก uvicorn กับ BIND_IP เอง ไม่ใช่ 0.0.0.0 จะได้ไม่เปิดออก interface อื่นของเครื่อง
    network_mode: host
    command: ["uvicorn", "app.main:app", "--host", "${BIND_IP}", "--port", "8000"]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://${BIND_IP}:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # ค่านี้ถูกฝังลง bundle ตอน build — เปลี่ยนแล้วต้อง --build ใหม่
        VITE_API_URL: ${VITE_API_URL}
    container_name: virtual_lab_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${BIND_IP}:80:80"

volumes:
  postgres_data:
