[pytest]
testpaths = tests
pythonpath = .
asyncio_default_fixture_loop_scope = function
# ตารางสรุปผลแบบ pytest-md-report (color=auto: มีสีเมื่อรันในเทอร์มินัล)
addopts = -ra --md-report --md-report-verbose=1 --md-report-color=auto
# warning จาก library (SkyPilot, passlib) ไม่ใช่โค้ดเรา
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::sqlalchemy.exc.MovedIn20Warning
