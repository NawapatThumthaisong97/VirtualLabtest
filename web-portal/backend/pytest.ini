[pytest]
testpaths = tests
pythonpath = .
asyncio_default_fixture_loop_scope = function
# ตารางสรุปผลรายเคสอยู่ใน tests/conftest.py (ปิดด้วย --no-case-table)
addopts = -ra
# warning จาก library (SkyPilot, passlib) ไม่ใช่โค้ดเรา
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::sqlalchemy.exc.MovedIn20Warning
