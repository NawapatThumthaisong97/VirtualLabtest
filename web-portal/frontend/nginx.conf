server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # react-router เป็น client-side routing — refresh ที่ /courses/123 แล้ว nginx
    # จะหาไฟล์นั้นไม่เจอและตอบ 404 ต้อง fallback กลับไป index.html ให้ router จัดการเอง
    location / {
        try_files $uri $uri/ /index.html;
    }

    # asset ที่ vite build ออกมามี content hash ในชื่อไฟล์อยู่แล้ว cache ยาวได้
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # mime.types ของ nginx ไม่มี .mjs → ตอบ application/octet-stream แล้วเบราว์เซอร์ไม่ยอมรัน module
        # pdf.js worker (pdf.worker.min-*.mjs) โหลดไม่ขึ้น หน้า lab เปิด PDF ไม่ได้
        # ใช้ default_type ใน location ซ้อน (ไม่ใช้ types {} ที่จะทับ MIME ของไฟล์ชนิดอื่นทั้งหมด)
        location ~ \.mjs$ {
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
