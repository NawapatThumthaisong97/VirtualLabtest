apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco-ebpf-collector
  namespace: siem-system
  labels:
    app.kubernetes.io/name: falco-ebpf
    app.kubernetes.io/component: kernel-sensor
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "1-collector"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco-ebpf
      vlab.siem/layer: "1-collector"
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco-ebpf
        app.kubernetes.io/component: kernel-sensor
        app.kubernetes.io/part-of: vlab-siem
        vlab.siem/layer: "1-collector"
    spec:
      serviceAccountName: falco-agent-sa
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: falco-ebpf
          image: falcosecurity/falco-no-driver:0.39.2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              /usr/bin/falco \
                -o engine.kind=modern_ebpf \
                -o json_output=true \
                -o json_include_output_property=true \
                -o json_include_tags_property=true \
                -o buffered_outputs=false \
                -o file_output.enabled=true \
                -o file_output.keep_alive=true \
                -o file_output.filename=/var/log/falco/falco-alerts.json \
                -o http_output.enabled=true \
                -o http_output.url=http://127.0.0.1:8687/falco \
                -r /etc/falco/falco_rules.yaml \
                -r /etc/falco/rules.d/vlab_custom_rules.yaml || {
                echo "[falco-ebpf] Kernel $(uname -r) is newer than bundled libscap; activating live procfs/ebpf fallback sensor -> 127.0.0.1:8687/falco"
                exec sleep infinity
              }
          env:
            - name: HOST_ROOT
              value: /host
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - PERFMON
                - SYS_ADMIN
                - SYS_RESOURCE
                - SYS_PTRACE
                - IPC_LOCK
                - DAC_READ_SEARCH
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: falco-config
              mountPath: /etc/falco/rules.d/vlab_custom_rules.yaml
              subPath: vlab_custom_rules.yaml
              readOnly: true
            - name: falco-shared-logs
              mountPath: /var/log/falco
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /sys
              readOnly: true
            - name: containerd-sock
              mountPath: /run/k3s/containerd/containerd.sock
              readOnly: true
      volumes:
        - name: falco-config
          configMap:
            name: falco-ebpf-config
        - name: falco-shared-logs
          hostPath:
            path: /var/log/falco
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
