apiVersion: v1
kind: Namespace
metadata:
  name: siem-system
  labels:
    app.kubernetes.io/name: siem-system
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "1-collector"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-agent-sa
  namespace: siem-system
  labels:
    app.kubernetes.io/name: vector-agent
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "1-collector"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco-agent-sa
  namespace: siem-system
  labels:
    app.kubernetes.io/name: falco-ebpf
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "1-collector"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vlab-siem-layer1-collector-reader
  labels:
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "1-collector"
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vlab-siem-layer1-collector-binding
  labels:
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "1-collector"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vlab-siem-layer1-collector-reader
subjects:
  - kind: ServiceAccount
    name: vector-agent-sa
    namespace: siem-system
  - kind: ServiceAccount
    name: falco-agent-sa
    namespace: siem-system
