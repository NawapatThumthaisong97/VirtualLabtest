apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-jetstream-config
  namespace: siem-system
  labels:
    app.kubernetes.io/name: nats-jetstream
    app.kubernetes.io/component: message-queue-buffer
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "2-buffer"
data:
  nats-server.conf: |
    # =========================================================================
    # Layer 2: NATS JetStream Configuration (Stateful Buffer & KV Store)
    # - Absorbs high-volume log bursts from ephemeral SkyPilot EC2/K3s nodes
    # - Persists streams and Key-Value (KV) alert states to disk (/data/jetstream)
    # - Internal K3s / Tailscale access only (zero public ports exposed)
    # =========================================================================
    server_name: $POD_NAME
    port: 4222
    http_port: 8222

    # Maximum payload size (8 MB) to handle rich eBPF stacktraces & batch logs
    max_payload: 8388608

    # JetStream Engine (Persistent Disk Storage + In-Memory KV Support)
    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: 134217728   # 128 MB RAM store
      max_file_store: 5368709120    # 5 GB Persistent Disk buffer
      domain: "vlab-siem"
    }

    # Logging & Diagnostics
    debug: false
    trace: false
    logtime: true
