apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-jetstream-bootstrap
  namespace: siem-system
  labels:
    app.kubernetes.io/name: nats-jetstream
    app.kubernetes.io/component: stream-kv-bootstrap
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "2-buffer"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    NATS_URL="${NATS_URL:-nats://nats-jetstream.siem-system.svc.cluster.local:4222}"
    echo "[Layer 2 Bootstrap] Waiting for NATS JetStream at ${NATS_URL}..."

    until nats --server="${NATS_URL}" server check jetstream >/dev/null 2>&1; do
      echo "  ... waiting for JetStream readiness"
      sleep 2
    done

    echo "[1/3] Provisioning Stream 'SIEM_TELEMETRY' (On-Disk Buffer for K3s & Ephemeral SkyPilot Bursts)..."
    nats --server="${NATS_URL}" stream add SIEM_TELEMETRY \
      --subjects="siem.logs.>" \
      --storage=file \
      --retention=limits \
      --discard=old \
      --max-msgs=-1 \
      --max-bytes=3221225472 \
      --max-age=72h \
      --max-msg-size=8388608 \
      --dupe-window=2m \
      --replicas=1 \
      --defaults >/dev/null 2>&1 || \
    nats --server="${NATS_URL}" stream edit SIEM_TELEMETRY \
      --subjects="siem.logs.>" \
      --max-bytes=3221225472 \
      --max-age=72h \
      --force >/dev/null 2>&1

    echo "[2/3] Provisioning Stream 'SIEM_FAST_TRACK' (Sub-second Critical Falco eBPF Alerts)..."
    nats --server="${NATS_URL}" stream add SIEM_FAST_TRACK \
      --subjects="siem.alerts.fast_track,siem.alerts.falco.>" \
      --storage=file \
      --retention=limits \
      --discard=old \
      --max-msgs=-1 \
      --max-bytes=536870912 \
      --max-age=24h \
      --max-msg-size=1048576 \
      --dupe-window=1m \
      --replicas=1 \
      --defaults >/dev/null 2>&1 || true

    echo "[3/3] Provisioning NATS Key-Value Store Bucket 'SIEM_ALERT_STATE' (Alert Deduplication & State Tracking)..."
    nats --server="${NATS_URL}" kv add SIEM_ALERT_STATE \
      --history=5 \
      --ttl=24h \
      --storage=file \
      --max-value-size=65536 \
      --max-bucket-size=134217728 >/dev/null 2>&1 || true

    echo "✓ Layer 2 NATS JetStream Streams & KV Store ('SIEM_ALERT_STATE') Ready!"
    nats --server="${NATS_URL}" stream ls
    nats --server="${NATS_URL}" kv ls
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-jetstream-bootstrap
  namespace: siem-system
  labels:
    app.kubernetes.io/name: nats-jetstream
    app.kubernetes.io/component: stream-kv-bootstrap
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "2-buffer"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-jetstream-bootstrap
        vlab.siem/layer: "2-buffer"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: nats-box-init
          image: natsio/nats-box:0.14.5
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          env:
            - name: NATS_URL
              value: "nats://nats-jetstream.siem-system.svc.cluster.local:4222"
          volumeMounts:
            - name: bootstrap-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: bootstrap-script
          configMap:
            name: nats-jetstream-bootstrap
            defaultMode: 0755
