apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-jetstream
  namespace: siem-system
  labels:
    app.kubernetes.io/name: nats-jetstream
    app.kubernetes.io/component: message-queue-buffer
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "2-buffer"
spec:
  serviceName: nats-jetstream-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-jetstream
      vlab.siem/layer: "2-buffer"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-jetstream
        app.kubernetes.io/component: message-queue-buffer
        app.kubernetes.io/part-of: vlab-siem
        vlab.siem/layer: "2-buffer"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nats-jetstream
          image: nats:2.10.22-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/nats-config/nats-server.conf"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: nats-config
              mountPath: /etc/nats-config
              readOnly: true
            - name: jetstream-disk-storage
              mountPath: /data/jetstream
      volumes:
        - name: nats-config
          configMap:
            name: nats-jetstream-config
  volumeClaimTemplates:
    - metadata:
        name: jetstream-disk-storage
        labels:
          app.kubernetes.io/name: nats-jetstream
          vlab.siem/layer: "2-buffer"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
