apiVersion: v1
kind: Service
metadata:
  name: vector-aggregator
  namespace: siem-system
  labels:
    app.kubernetes.io/name: vector-aggregator
    app.kubernetes.io/component: log-processor-normalizer
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "3-processing"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vector-aggregator
    vlab.siem/layer: "3-processing"
  ports:
    - name: internal-ingest
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-aggregator
  namespace: siem-system
  labels:
    app.kubernetes.io/name: vector-aggregator
    app.kubernetes.io/component: log-processor-normalizer
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "3-processing"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vector-aggregator
      vlab.siem/layer: "3-processing"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-aggregator
        app.kubernetes.io/component: log-processor-normalizer
        app.kubernetes.io/part-of: vlab-siem
        vlab.siem/layer: "3-processing"
    spec:
      serviceAccountName: vector-agent-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Schedule Vector Aggregator on Worker nodes separate from Master (Control-Plane)
      # Uses weight 100 preferred anti-affinity so multi-node clusters strictly avoid Master,
      # while single-node test clusters can still schedule and test the Deployment live.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: vector-aggregator
          image: timberio/vector:0.42.0-debian
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/vector-aggregator/vector-aggregator.yaml
          env:
            - name: SIEM_CENTRAL_TAILSCALE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: siem-collector-secrets
                  key: central-tailscale-endpoint
                  optional: true
            - name: SIEM_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: siem-collector-secrets
                  key: collector-token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: aggregator-config
              mountPath: /etc/vector-aggregator
              readOnly: true
            - name: threat-geoip-tables
              mountPath: /etc/vector-aggregator/enrichment
              readOnly: true
            - name: aggregator-data
              mountPath: /var/lib/vector-aggregator
      volumes:
        - name: aggregator-config
          configMap:
            name: vector-aggregator-config
        - name: threat-geoip-tables
          configMap:
            name: vector-aggregator-threat-geoip
        - name: aggregator-data
          emptyDir: {}

