apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: siem-system
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: hot-storage
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "4-storage"
    vlab.siem/storage-tier: "hot"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: victorialogs
    vlab.siem/layer: "4-storage"
  ports:
    - name: http
      port: 9428
      targetPort: 9428
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs-tailscale-ui
  namespace: siem-system
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: hot-storage-ui
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "4-storage"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: victorialogs
    vlab.siem/layer: "4-storage"
  ports:
    - name: http-ui
      port: 9428
      targetPort: 9428
      nodePort: 30428
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  namespace: siem-system
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: hot-storage
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "4-storage"
    vlab.siem/storage-tier: "hot"
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
      vlab.siem/layer: "4-storage"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        app.kubernetes.io/component: hot-storage
        app.kubernetes.io/part-of: vlab-siem
        vlab.siem/layer: "4-storage"
        vlab.siem/storage-tier: "hot"
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.15.0-victorialogs
          imagePullPolicy: IfNotPresent
          args:
            - "-storageDataPath=/vlogs-data"
            - "-retentionPeriod=14d"
            - "-httpListenAddr=:9428"
            - "-logNewStreams=false"
            - "-insert.maxLineSizeBytes=256KiB"
            - "-search.maxQueryDuration=30s"
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 192Mi
          volumeMounts:
            - name: victorialogs-hot-disk
              mountPath: /vlogs-data
  volumeClaimTemplates:
    - metadata:
        name: victorialogs-hot-disk
        labels:
          app.kubernetes.io/name: victorialogs
          vlab.siem/layer: "4-storage"
          vlab.siem/storage-tier: "hot"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi

