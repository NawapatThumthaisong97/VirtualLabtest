apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-siem-provisioning
  namespace: siem-system
  labels:
    app.kubernetes.io/name: grafana-siem
    app.kubernetes.io/component: detection-visualization
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "5-detection"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: SIEM-PostgreSQL
        uid: siem-postgres-ds
        type: postgres
        access: proxy
        url: ${SIEM_POSTGRES_HOST:100.86.87.27:5432}
        user: ${SIEM_POSTGRES_USER:postgres}
        database: virtual_lab
        isDefault: true
        editable: true
        secureJsonData:
          password: "${SIEM_POSTGRES_PASSWORD:password}"
        jsonData:
          sslmode: "disable"
          postgresVersion: 1500
          timescaledb: false
      - name: VictoriaLogs-HotStorage
        uid: victorialogs-hot-ds
        type: prometheus
        access: proxy
        url: http://victorialogs.siem-system.svc.cluster.local:9428
        isDefault: false
        editable: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'VirtualLab-SIEM-Dashboards'
        orgId: 1
        folder: 'VirtualLab 5-Layer SIEM'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
  alerting.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: siem-sigma-and-fasttrack-alerts
        folder: VirtualLab 5-Layer SIEM
        interval: 1m
        rules:
          - uid: sigma-critical-threat-rule
            title: "Sigma & Falco Fast-Track Critical Security Alert"
            condition: A
            for: 0s
            annotations:
              summary: "Critical security violation detected by Sigma LogsQL or Falco eBPF Fast-Track"
            labels:
              severity: critical
              layer: "5-detection"
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: siem-postgres-ds
                model:
                  rawSql: "SELECT COUNT(*) AS value FROM infrastructure_logs WHERE severity = 'CRITICAL' AND timestamp >= NOW() - INTERVAL '5 minutes';"
                  format: table
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-siem
  namespace: siem-system
  labels:
    app.kubernetes.io/name: grafana-siem
    app.kubernetes.io/component: detection-visualization
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "5-detection"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana-siem
    vlab.siem/layer: "5-detection"
  ports:
    - name: http-grafana
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-siem
  namespace: siem-system
  labels:
    app.kubernetes.io/name: grafana-siem
    app.kubernetes.io/component: detection-visualization
    app.kubernetes.io/part-of: vlab-siem
    vlab.siem/layer: "5-detection"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-siem
      vlab.siem/layer: "5-detection"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-siem
        app.kubernetes.io/component: detection-visualization
        app.kubernetes.io/part-of: vlab-siem
        vlab.siem/layer: "5-detection"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: Exists
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "vlab-siem-admin"
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_DEFAULT_THEME
              value: "dark"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/vlab-siem-visual-analytics.json"
            - name: SIEM_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: siem-collector-secrets
                  key: postgres-user
                  optional: true
            - name: SIEM_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: siem-collector-secrets
                  key: postgres-host
                  optional: true
            - name: SIEM_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siem-collector-secrets
                  key: postgres-password
                  optional: true
          ports:
            - name: http-grafana
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 400m
              memory: 256Mi
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting/alerting.yaml
              subPath: alerting.yaml
            - name: grafana-dashboard-json
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-siem-provisioning
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-siem-provisioning
        - name: grafana-alerting
          configMap:
            name: grafana-siem-provisioning
        - name: grafana-dashboard-json
          configMap:
            name: grafana-siem-dashboards
        - name: grafana-storage
          emptyDir: {}

