apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: virtual-lab
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: reverse-proxy-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      serviceAccountName: oauth2-proxy-sa
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/oauth2-proxy/oauth2-proxy.cfg
          env:
            # Secrets securely referenced from Kubernetes Secrets (Constraint 1)
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth-secret
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/oauth2-proxy
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: oauth2-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: virtual-lab
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: reverse-proxy-auth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: 4180
      protocol: TCP
  selector:
    app.kubernetes.io/name: oauth2-proxy

