# Kubernetes-native Secret Manifests (TEMPLATE)
#
# IMPORTANT: DO NOT commit plaintext credentials to Git!
# Use this template for reference, or execute `k8s/scripts/setup-auth-secrets.sh`
# to generate and apply these secrets securely via kubectl.
#
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: virtual-lab
  labels:
    app.kubernetes.io/name: virtual-lab-backend
    app.kubernetes.io/component: authentication
type: Opaque
stringData:
  # Cryptographically random key (at least 32 bytes)
  secret-key: "REPLACE_WITH_GENERATED_JWT_SECRET_KEY"
  algorithm: "HS256"
---
apiVersion: v1
kind: Secret
metadata:
  name: google-oauth-secret
  namespace: virtual-lab
  labels:
    app.kubernetes.io/name: virtual-lab-auth
    app.kubernetes.io/component: google-sso
type: Opaque
stringData:
  # Google OAuth2 Client ID from Google Cloud Console
  client-id: "REPLACE_WITH_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  # Google OAuth2 Client Secret
  client-secret: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: virtual-lab
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: reverse-proxy-auth
type: Opaque
stringData:
  # 16, 24, or 32-byte secret for cookie encryption (e.g., openssl rand -base64 32 | head -c 32)
  cookie-secret: "REPLACE_WITH_32_BYTE_BASE64_COOKIE_SECRET=="
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secret
  namespace: virtual-lab
  labels:
    app.kubernetes.io/name: virtual-lab-database
    app.kubernetes.io/component: storage
type: Opaque
stringData:
  database-url: "postgresql://postgres:REPLACE_WITH_DB_PASSWORD@virtual-lab-db:5432/virtual_lab"
