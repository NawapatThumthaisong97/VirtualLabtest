# Ingress & Forward-Auth Middleware configuration
# Integrates oauth2-proxy with Traefik (k3s default) and standard Ingress controllers
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sso-forward-auth
  namespace: virtual-lab
  labels:
    app.kubernetes.io/component: ingress-security
spec:
  forwardAuth:
    address: http://oauth2-proxy.virtual-lab.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Forwarded-User
      - X-Forwarded-Email
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: virtual-lab-ingress
  namespace: virtual-lab
  annotations:
    # Traefik middleware annotation (k3s)
    traefik.ingress.kubernetes.io/router.middlewares: virtual-lab-sso-forward-auth@kubernetescrd
    # NGINX Ingress Controller annotations (alternative standard)
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.virtual-lab.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Forwarded-User,X-Forwarded-Email"
spec:
  rules:
    - host: vlab.dome.tu.ac.th
      http:
        paths:
          # oauth2-proxy endpoints (login, callback, start, userinfo)
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
          # Backend API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: virtual-lab-backend
                port:
                  number: 8000
          # Frontend Portal
          - path: /
            pathType: Prefix
            backend:
              service:
                name: virtual-lab-frontend
                port:
                  number: 80
