#ใช้ Tags สําหรับการ Debug เราสามารถเลือกได้ว่าจะทํา role ไหน หากเราเคยทําไปแล้ว
- name: Provision Virtual-Lab master
  hosts: master
  become: yes
  roles:
    - { role: common, tags: ['common'] }
    - { role: tailscale, tags: ['tailscale'] }
    - { role: k3s-server, tags: ['k3s-server'] }
    - { role: skypilot-node, tags: ['skypilot-node'] }
    - { role: siem-log-forwarding, tags: ['siem-log-forwarding', 'monitoring'] }

- name: Provision Virtual-Lab workers
  hosts: workers
  become: yes
  roles:
    - { role: common, tags: ['common'] }
    - { role: tailscale, tags: ['tailscale'] }
    - { role: k3s-agent, tags: ['k3s-agent'] }
    - { role: siem-log-forwarding, tags: ['siem-log-forwarding', 'monitoring'] }  

- name: Provision Virtual-Lab registry
  hosts: registry
  become: yes
  roles:
    - { role: common, tags: ['common'] }
    - { role: registry, tags: ['registry'] }
    # ต้องรันหลัง registry (ใช้ docker + camp-registry ที่ role นั้นตั้งไว้)
    - { role: scan-runner-image, tags: ['scan-runner'] }
    # sync image ใน camp registry ขึ้น ECR (เปิดด้วย ecr_sync_enabled: true)
    - { role: ecr-sync, tags: ['ecr-sync'] }

# วางท้ายสุดเพราะต้องดึง kubeconfig จาก master ที่ provision เสร็จแล้ว
- name: Provision Virtual-Lab web service
  hosts: webservice
  become: yes
  roles:
    - { role: common, tags: ['common'] }
    - { role: tailscale, tags: ['tailscale'] }
    - { role: web-service, tags: ['web-service'] }