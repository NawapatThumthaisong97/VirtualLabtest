- name: Check if Tailscale is installed
  ansible.builtin.command: which tailscale
  register: ts_installed
  changed_when: false
  failed_when: false

- name: Install Tailscale
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: ts_installed.rc != 0

- name: Check Tailscale login state
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Report Tailscale state
  ansible.builtin.debug:
    msg: >-
      {{ 'Tailscale ยัง logged out — ต้อง tailscale up เอง อย่าลืม flags เดิม (--advertise-routes)'
         if ts_status.rc != 0 else 'Tailscale online อยู่แล้ว ข้ามได้' }}

# master รัน SkyPilot API server ซึ่ง SSH เข้า EC2 ของ lab ที่ private subnet (10.10.2.0/24, 10.10.3.0/24)
# ผ่าน Tailscale subnet router บน AWS — Linux ไม่รับ subnet route เป็นค่าเริ่มต้น ไม่ตั้ง = launch AWS ค้างตอน SSH
# `tailscale set` แก้เฉพาะ flag นี้ ไม่ล้าง flag อื่น (ต่างจาก tailscale up) รันซ้ำได้
- name: Accept Tailscale subnet routes (master → AWS lab subnets)
  ansible.builtin.command: tailscale set --accept-routes
  when:
    - ts_status.rc == 0
    - inventory_hostname in groups['master']
  changed_when: false