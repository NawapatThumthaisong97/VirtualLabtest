# ---------- Docker ----------
# ติดตั้งจาก repo ทางการของ Docker ไม่ใช้ docker.io ของ Ubuntu
# เพราะตัวนั้นเก่าและไม่มี compose v2 plugin ติดมาด้วย

- name: Install Docker apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - rsync
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Add remote user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

# ---------- Source code ----------

- name: Create web-portal directory
  ansible.builtin.file:
    path: "{{ webportal_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ส่งเฉพาะ source — node_modules/venv สร้างใหม่ใน image อยู่แล้วและใหญ่มาก
# storage/ ไม่ sync เพราะเป็นข้อมูลฝั่ง server ไม่ใช่ของที่มาจาก repo
#
# synchronize อ่านค่า become จาก play ไม่ใช่จาก task — ใส่ become: false ตรงนี้อย่างเดียว
# ไม่พอ มันยังเติม --rsync-path='sudo -u root rsync' มาให้อยู่ดี แล้ว sudo ตัวนั้นรันโดยไม่มี
# tty จึงรับรหัสจาก -K ไม่ได้และ fail ทันที ต้อง override rsync_path เป็น rsync เปล่า ๆ ด้วย
#
# ไม่ต้องใช้ root อยู่แล้วเพราะ task ก่อนหน้าตั้ง owner ของ directory เป็น ansible_user ไว้
- name: Sync web-portal source to target
  become: false
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../web-portal/"
    dest: "{{ webportal_dir }}/"
    rsync_path: "rsync"
    delete: yes
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=.env"
      - "--exclude=storage"
      - "--exclude=dist"
      - "--exclude=kubeconfig.yaml"

- name: Ensure storage directory exists (ไฟล์เอกสารแลป — ห้ามถูก rsync ลบ)
  ansible.builtin.file:
    path: "{{ webportal_dir }}/backend/storage"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ---------- kubeconfig ----------
# k3s เขียน kubeconfig โดยชี้ server เป็น 127.0.0.1 เสมอ
# ถ้าเอามาใช้ที่เครื่องนี้ตรง ๆ backend จะเรียกหาตัวเองแล้วพัง
# ต้องเปลี่ยนเป็น Tailscale IP ของ master ซึ่ง cert ครอบไว้แล้วด้วย --tls-san

- name: Read kubeconfig from master
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['master'][0] }}"
  register: master_kubeconfig

- name: Write kubeconfig with master IP substituted
  ansible.builtin.copy:
    content: >-
      {{ master_kubeconfig.content | b64decode
         | regex_replace('https://127\.0\.0\.1:6443',
                         'https://' ~ webportal_k8s_master_ip ~ ':6443') }}
    dest: "{{ webportal_dir }}/backend/kubeconfig.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true

# ---------- Config ----------

- name: Render backend .env
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ webportal_dir }}/backend/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  notify: restart web-portal

- name: Render compose .env
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ webportal_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  notify: restart web-portal

# ---------- Deploy ----------

- name: Build and start web-portal stack
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml up -d --build
    chdir: "{{ webportal_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"

# ต้องยิงที่ bind IP ไม่ใช่ 127.0.0.1 — compose ผูก port ไว้กับ tailscale0 เท่านั้น
# ฉะนั้น loopback ไม่มีอะไร listen อยู่ เรียกไปก็ connection refused ตลอด
- name: Wait for backend to become healthy
  ansible.builtin.uri:
    url: "http://{{ webportal_bind_ip }}:{{ webportal_api_port }}/health"
    status_code: 200
  register: backend_health
  until: backend_health.status == 200
  retries: 30
  delay: 5

- name: Wait for frontend to respond
  ansible.builtin.uri:
    url: "http://{{ webportal_bind_ip }}:{{ webportal_http_port }}/"
    status_code: 200
  register: frontend_health
  until: frontend_health.status == 200
  retries: 12
  delay: 5

- name: Report access URL
  ansible.builtin.debug:
    msg: >-
      web-portal พร้อมใช้งานที่ http://{{ webportal_bind_ip }}
      (API: http://{{ webportal_bind_ip }}:{{ webportal_api_port }}{{ webportal_api_prefix }})
      — เข้าได้เฉพาะเครื่องที่อยู่ใน tailnet เดียวกัน
