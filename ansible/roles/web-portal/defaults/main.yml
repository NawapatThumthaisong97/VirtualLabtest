# ที่ตั้งของ web-portal บนเครื่อง target
webportal_dir: /opt/web-portal

# ผูก port กับ Tailscale IP ของเครื่องเอง ไม่ใช่ 0.0.0.0
# กัน service โผล่บน interface อื่นโดยไม่ตั้งใจ
webportal_bind_ip: "{{ ansible_host }}"

webportal_http_port: 80
webportal_api_port: 8000

# --- Postgres ---
webportal_postgres_user: postgres
webportal_postgres_db: virtual_lab
# ค่าจริงควรมาจาก vault — default ไว้ให้รันได้ก่อนแต่ต้องเปลี่ยน
webportal_postgres_password: "{{ vault_postgres_password | default('changeme-in-vault') }}"

# --- Backend ---
webportal_secret_key: "{{ vault_backend_secret_key | default('changeme-in-vault') }}"
webportal_debug: false
webportal_api_prefix: /api

# master ที่ backend จะคุยด้วยผ่าน kubeconfig
webportal_k8s_master_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"

# registry ที่ SkyPilot จะดึง image ของ lab ไปใช้ — ดึงจาก inventory ไม่ฮาร์ดโค้ด
# ค่า default ในโค้ด (session_service) ชี้ registry เก่าที่ตายแล้ว ต้องส่งค่านี้
# ไปทับเสมอ ไม่งั้น pod จะ pull image ไม่ได้
webportal_registry_endpoint: "{{ hostvars[groups['registry'][0]]['ansible_host'] }}:5001"
webportal_k8s_enabled: true

# seed ข้อมูล persona (Sophia + วิชา + lab) — ปิดไว้เป็นค่าเริ่มต้นเพราะเขียนทับ
# ข้อมูลเดิมได้ เปิดตอนตั้งเครื่องใหม่ด้วย -e webportal_seed=true
webportal_seed: false

# SkyPilot กลางที่ backend ส่ง launch ไป (role skypilot-node) — "" = ใช้ SkyPilot ใน container แทน
# ชี้ NodePort 30880 บน master ผ่าน Tailscale (k8s/skypilot-api-tailnet-service.yaml) ไม่ใช่ https://<skypilot_domain>
# เพราะทาง Cloudflare ช้าจน sky SDK timeout — เครื่อง web-portal ต้องติด tag:vlab-server ถึงเข้าพอร์ตนี้ได้
webportal_skypilot_endpoint: "http://{{ webportal_k8s_master_ip }}:30880"
# token ของ service account (สร้างจาก dashboard) ต้องตั้งใน group_vars เมื่อใช้ SkyPilot กลาง
webportal_skypilot_token: "{{ skypilot_backend_token | default('') }}"
