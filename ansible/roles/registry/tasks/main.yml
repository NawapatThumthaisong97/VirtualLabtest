---
# ติดตั้ง private Docker registry (camp-registry, port 5001)  เก็บ image ให้เครื่องอื่นดึงไปใช้
# เครื่อง registry  ต้องติดตั้ง Docker Engine เองก่อน
- name: Ensure Docker Engine is installed
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure registry storage directory exists
  ansible.builtin.file:
    path: /srv/camp-registry
    state: directory
    mode: "0755"

- name: Check if camp-registry container exists
  ansible.builtin.command: docker inspect camp-registry
  register: camp_registry_inspect
  failed_when: false
  changed_when: false

- name: Camp private registry (port 5001)
  ansible.builtin.command: >-
    docker run -d
    --name camp-registry
    --restart always
    -p 5001:5001
    -e REGISTRY_HTTP_ADDR=0.0.0.0:5001
    -e REGISTRY_STORAGE_DELETE_ENABLED=true
    -v /srv/camp-registry:/var/lib/registry
    registry:2
  when: camp_registry_inspect.rc != 0

- name: Ensure camp-registry container is running
  ansible.builtin.command: docker start camp-registry
  register: camp_registry_start
  changed_when: "'camp-registry' in camp_registry_start.stdout"
  when: camp_registry_inspect.rc == 0
