---
# Validate required variables
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - skypilot_domain is defined
      - cloudflare_tunnel_token is defined
      - skypilot_chart_version is defined
      - skypilot_admin_password is defined
      - skypilot_aws_access_key_id is defined
      - skypilot_aws_secret_access_key is defined
    fail_msg: "Missing required variables. Please check group_vars/all.yml"
    success_msg: "All required variables are defined"

# ติดตั้ง Helm (ถ้ายังไม่มี)
- name: Check if helm is installed
  ansible.builtin.command: which helm
  register: helm_check
  ignore_errors: yes
  changed_when: false

- name: Install Helm
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: helm_check.rc != 0

# ติดตั้ง Nginx Ingress Controller
- name: Create skypilot-ingress namespace
  ansible.builtin.shell: |
    k3s kubectl create namespace skypilot-ingress --dry-run=client -o yaml | k3s kubectl apply -f -

# ล็อกเวอร์ชันตามที่ลงอยู่จริง (2026-08-09) ไม่ล็อก = รัน playbook เมื่อไหร่ได้ chart ล่าสุด
# ทางเข้า dashboard (Cloudflare → nginx) อาจเปลี่ยนโดยไม่ตั้งใจ
- name: Install Nginx Ingress Controller via Helm
  ansible.builtin.shell: |
    helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
    helm repo update
    helm upgrade --install skypilot-ingress ingress-nginx/ingress-nginx \
      --version {{ skypilot_ingress_nginx_chart_version | default('4.15.1') }} \
      --namespace skypilot-ingress \
      --set controller.service.type=ClusterIP \
      --set controller.service.name=nginx-controller \
      --set controller.ingressClassResource.name=skypilot-nginx \
      --set controller.ingressClass=skypilot-nginx \
      --wait \
      --timeout 10m \
      --debug
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# สร้าง namespace สำหรับ SkyPilot
# Idempotent by default: ของเดิมลบ namespace ทิ้งแบบไม่มีเงื่อนไขทุกครั้งที่รัน playbook ทำให้
# state ของ API server (cluster records/job history) หายทุกรอบ แม้รันซ้ำกับ deployment ที่ใช้งาน
# จริงอยู่ก็ตาม - ตอนนี้ลบเฉพาะตอนสั่ง `-e skypilot_reset=true` เท่านั้น ปกติจะข้ามไปเลย
# ⚠️ reset ลบ PVC ด้วย = user / service account token (ของ backend) / config หายหมด
#    ต้องสร้าง token ใหม่จาก dashboard แล้วใส่ skypilot_backend_token ใน group_vars ใหม่
- name: Delete existing SkyPilot namespace (only when skypilot_reset=true)
  ansible.builtin.shell: |
    k3s kubectl delete namespace skypilot --ignore-not-found=true --wait=true --timeout=120s
  ignore_errors: yes
  when: skypilot_reset | default(false) | bool

- name: Wait for namespace to be fully deleted
  ansible.builtin.shell: |
    for i in {1..60}; do
      if ! k3s kubectl get namespace skypilot &>/dev/null; then
        echo "Namespace deleted"
        exit 0
      fi
      echo "Waiting for namespace deletion... ($i/60)"
      sleep 2
    done
    exit 1
  register: ns_delete_wait
  retries: 1
  delay: 5
  until: ns_delete_wait.rc == 0
  when: skypilot_reset | default(false) | bool

- name: Ensure SkyPilot namespace exists
  ansible.builtin.shell: |
    k3s kubectl create namespace skypilot --dry-run=client -o yaml | k3s kubectl apply -f -

# SkyPilot กลางสร้าง pod lab ใน ns ของตัวเอง (skypilot) ไม่ใช่ default
# NetworkPolicy ใน default (role k3s-server) จึงไม่คลุม ต้อง apply ที่นี่อีกชุด
# เลือก label vlab/lab=true เท่านั้น pod API server ไม่โดน
- name: Apply lab isolation NetworkPolicy (skypilot namespace)
  ansible.builtin.shell: |
    cat <<'YAML' | k3s kubectl apply -f -
    {{ lookup('file', playbook_dir + '/../k8s/lab-isolation-networkpolicy.yaml') | from_yaml | combine({'metadata': {'namespace': 'skypilot'}}, recursive=true) | to_nice_yaml(indent=2) }}
    YAML
  register: lab_np_skypilot
  changed_when: "'unchanged' not in lab_np_skypilot.stdout"

# รหัส admin ของ dashboard (basic auth ใน API server) ใช้ตอนสร้าง user ครั้งแรกเท่านั้น
# เปลี่ยนรหัสทีหลังทำใน dashboard (เก็บใน PVC) ไม่ต้องแก้ secret นี้
- name: Check SkyPilot admin secret
  ansible.builtin.command: k3s kubectl get secret skypilot-initial-basic-auth -n skypilot
  register: skypilot_admin_secret
  failed_when: false
  changed_when: false

- name: Create SkyPilot admin secret (htpasswd apr1)
  ansible.builtin.shell: |
    set -o pipefail
    printf 'admin:%s' "$(openssl passwd -apr1 "$SKYPILOT_ADMIN_PASSWORD")" | \
      k3s kubectl create secret generic skypilot-initial-basic-auth -n skypilot --from-file=auth=/dev/stdin
  args:
    executable: /bin/bash
  environment:
    SKYPILOT_ADMIN_PASSWORD: "{{ skypilot_admin_password }}"
  no_log: true
  when: skypilot_admin_secret.rc != 0

# AWS credential ของ IAM user Skypilot-IAM (ไม่ใช่ root) ให้ server กลาง launch lab บน EC2
# helm อ่านจาก secret นี้ (awsCredentials.enabled ข้างล่าง) ถ้าไม่มี pod ของ server ขึ้นไม่ได้
# apply ทับทุกรอบ เปลี่ยน key ใน group_vars แล้วรันใหม่ได้เลย (ต้อง restart pod ให้อ่านค่าใหม่)
- name: Create AWS credentials secret (Skypilot-IAM)
  ansible.builtin.shell: |
    set -o pipefail
    k3s kubectl create secret generic aws-credentials -n skypilot \
      --from-literal=aws_access_key_id="$AWS_ACCESS_KEY_ID" \
      --from-literal=aws_secret_access_key="$AWS_SECRET_ACCESS_KEY" \
      --dry-run=client -o yaml | k3s kubectl apply -f -
  args:
    executable: /bin/bash
  environment:
    AWS_ACCESS_KEY_ID: "{{ skypilot_aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ skypilot_aws_secret_access_key }}"
  register: aws_secret
  changed_when: "'unchanged' not in aws_secret.stdout"
  no_log: true

# ติดตั้ง SkyPilot API Server ผ่าน Helm
- name: Add SkyPilot Helm repo
  ansible.builtin.shell: |
    helm repo add skypilot https://helm.skypilot.co
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Create SkyPilot values file
  ansible.builtin.copy:
    content: |
      # API Service configuration
      apiService:
        # Resources for SkyPilot API Server
        # memory: เดิม limit 2Gi → container ชนเพดานตลอด (memory.events max หลายร้อยครั้ง) ช้าจน backend
        # ได้ "Could not connect" และโดน OOMKilled 3 ครั้งใน 1 วัน (2026-10-19) เพราะ server แยก process
        # ต่อ request ตัวละ 150–290MB ระหว่าง launch — ขยายเป็น 2Gi / 4Gi (master มี RAM 7G)
        # requests ใช้เป็น SKYPILOT_POD_MEMORY_BYTES_LIMIT ให้ SkyPilot คำนวณจำนวน worker ด้วย
        resources:
          requests:
            cpu: "1500m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        
        # Upgrade strategy (Recreate จำเป็นเมื่อ storage เป็น ReadWriteOnce)
        upgradeStrategy: Recreate

        # Replicas
        replicas: 1

        # ปักไว้ที่ master — PVC ของ local-path ผูกกับดิสก์ของ node ที่ pod ลงครั้งแรก
        # ถ้าไม่ปักจะไปลง worker (เช่น thinkpad) แล้ว state ไปอยู่บนเครื่องนั้น
        nodeSelector:
          kubernetes.io/hostname: {{ ansible_hostname | lower }}

        # basic auth ใน API server (มี user / RBAC / service account token)
        # admin สร้างจาก secret skypilot-initial-basic-auth (task ข้างบน)
        enableUserManagement: true
        initialBasicAuthSecret: skypilot-initial-basic-auth

        # config ของ SkyPilot ฝั่ง server — ใช้ตอน PVC ยังไม่มี config เท่านั้น
        # (ถ้ามีแล้วจะเอาของ PVC แก้ทีหลังต้องเขียน ~/.sky/config.yaml ใน pod แล้ว restart)
        # ports: podip = เปิดพอร์ต lab ด้วย pod IP แทน LoadBalancer (servicelb รับบนทุกเครื่อง
        # → เครื่องข้าง ๆ เปิด lab ได้ และ NetworkPolicy ตัด servicelb ทิ้ง) ดู skypilot/sky-config.yaml
        # aws: launch lab บน EC2 ใน private subnet ของ VPC vlab-ecr-pull (SSH ผ่าน Tailscale router
        # → master ต้อง accept-routes ดู role tailscale) use_ssm: false ไม่งั้น use_internal_ips
        # ที่ไม่มี ssh_proxy_command ทำให้ SkyPilot 0.12.3 หันไปใช้ SSM ซึ่งใช้ใน VPC นี้ไม่ได้
        config: |
          kubernetes:
            ports: podip
          aws:
            vpc_names: vlab-ecr-pull
            use_internal_ips: true
            use_ssm: false
            security_group_name: vlab-lab-instances
            remote_identity: vlab-lab-ecr-pull

      # AWS credential (IAM user Skypilot-IAM) จาก secret aws-credentials ใน ns skypilot
      # secret สร้างใน task "Create AWS credentials secret" ถ้าไม่ตั้งค่านี้ helm upgrade จะถอด credential ออก
      # แล้ว lab ที่ run_target = AWS launch ไม่ได้
      awsCredentials:
        enabled: true

      # Service configuration
      service:
        type: ClusterIP
        port: 80

      # ปิด built-in ingress (เราจะสร้างเอง)
      ingress:
        enabled: false

      # เปิด storage: เก็บ user, service account token (ของ backend), config, cluster records
      # ถ้าปิด restart pod เมื่อไหร่ token ของ backend หาย → backend launch ไม่ได้
      storage:
        enabled: true

      # ปิด ingress-nginx subchart สนิท (เราติดตั้งแยกแล้ว)
      ingress-nginx:
        enabled: false
    dest: /tmp/skypilot-values.yaml

- name: Install SkyPilot API Server via Helm
  ansible.builtin.shell: |
    helm upgrade --install skypilot-api skypilot/skypilot \
      --version {{ skypilot_chart_version }} \
      --namespace skypilot \
      --values /tmp/skypilot-values.yaml \
      --set ingress-nginx.enabled=false \
      --set apiService.skipResourceCheck=true \
      --wait \
      --timeout 10m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: skypilot_install

# รอให้ SkyPilot pods พร้อม (ไม่บังคับ - เพื่อไม่ให้ blocking)
- name: Wait for SkyPilot pods to be ready
  ansible.builtin.command: |
    k3s kubectl wait --for=condition=ready pod -n skypilot -l app.kubernetes.io/name=skypilot-api-server --timeout=60s
  register: skypilot_ready
  ignore_errors: yes
  failed_when: false

# สร้าง Ingress สำหรับ SkyPilot (manual เพราะ Helm อาจสร้างไม่ถูก)
- name: Wait for SkyPilot service to be created
  ansible.builtin.shell: |
    for i in {1..30}; do
      SVC=$(k3s kubectl get svc -n skypilot -o name | head -n 1)
      if [ -n "$SVC" ]; then
        echo "$SVC" | cut -d/ -f2
        exit 0
      fi
      sleep 2
    done
    exit 1
  register: skypilot_svc_name
  retries: 3
  delay: 5
  until: skypilot_svc_name.rc == 0

- name: Display detected SkyPilot service
  ansible.builtin.debug:
    msg: "Detected SkyPilot Service: {{ skypilot_svc_name.stdout }}"

- name: Create Ingress for SkyPilot
  ansible.builtin.copy:
    content: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: skypilot-api-ingress
        namespace: skypilot
      spec:
        ingressClassName: skypilot-nginx
        rules:
        - host: {{ skypilot_domain }}
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: {{ skypilot_svc_name.stdout }}
                  port:
                    number: 80
    dest: /tmp/skypilot-ingress.yaml

- name: Apply SkyPilot Ingress
  ansible.builtin.command: k3s kubectl apply -f /tmp/skypilot-ingress.yaml

# ทางเข้าของ backend ผ่าน Tailscale (NodePort 30880) แทน Cloudflare ที่ช้า / สะดุดจน sky SDK
# (health check timeout 2.5s) launch พัง เหตุผลเต็มอยู่ในไฟล์ manifest
- name: Apply SkyPilot API NodePort for the backend (Tailscale)
  ansible.builtin.shell: |
    cat <<'YAML' | k3s kubectl apply -f -
    {{ lookup('file', playbook_dir + '/../k8s/skypilot-api-tailnet-service.yaml') }}
    YAML
  register: skypilot_tailnet_svc
  changed_when: "'unchanged' not in skypilot_tailnet_svc.stdout"

- name: Wait for Ingress to be created
  ansible.builtin.command: |
    k3s kubectl get ingress skypilot-api-ingress -n skypilot
  retries: 10
  delay: 3
  register: ingress_check
  until: ingress_check.rc == 0

# ตรวจสอบ Service และ Ingress ที่ถูกสร้าง
- name: Get SkyPilot service name and details
  ansible.builtin.shell: |
    k3s kubectl get svc -n skypilot -o json | jq -r '.items[0].metadata.name'
  register: skypilot_service_name
  ignore_errors: yes

- name: Display SkyPilot service name
  ansible.builtin.debug:
    msg: "SkyPilot Service Name: {{ skypilot_service_name.stdout }}"

- name: Get Nginx Ingress service name
  ansible.builtin.shell: |
    k3s kubectl get svc -n skypilot-ingress -l app.kubernetes.io/component=controller -o json | jq -r '.items[0].metadata.name'
  register: nginx_service_name

- name: Display Nginx service name
  ansible.builtin.debug:
    msg: "Nginx Service Name: {{ nginx_service_name.stdout }}"

- name: Get SkyPilot ingress backend service
  ansible.builtin.shell: |
    k3s kubectl get ingress -n skypilot -o json | jq -r '.items[0].spec.rules[0].http.paths[0].backend.service.name'
  register: ingress_backend
  ignore_errors: yes

- name: Display Ingress backend service
  ansible.builtin.debug:
    msg: "Ingress Backend Service: {{ ingress_backend.stdout }}"

# ติดตั้ง Cloudflare Tunnel
- name: Create Cloudflare Tunnel secret
  ansible.builtin.shell: |
    k3s kubectl create secret generic cloudflare-tunnel-token \
      --from-literal=token={{ cloudflare_tunnel_token }} \
      --namespace skypilot-ingress \
      --dry-run=client -o yaml | k3s kubectl apply -f -

- name: Deploy Cloudflare Tunnel
  ansible.builtin.copy:
    content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflare-tunnel
        namespace: skypilot-ingress
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: cloudflare-tunnel
        template:
          metadata:
            labels:
              app: cloudflare-tunnel
          spec:
            containers:
            - name: cloudflared
              image: cloudflare/cloudflared:latest
              args:
              - tunnel
              - --no-autoupdate
              - run
              - --token
              - $(TUNNEL_TOKEN)
              env:
              - name: TUNNEL_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: cloudflare-tunnel-token
                    key: token
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
    dest: /tmp/cloudflare-tunnel.yaml

- name: Apply Cloudflare Tunnel deployment
  ansible.builtin.command: k3s kubectl apply -f /tmp/cloudflare-tunnel.yaml

- name: Wait for Cloudflare Tunnel to be ready
  ansible.builtin.command: |
    k3s kubectl wait --for=condition=available deployment/cloudflare-tunnel \
      --namespace skypilot-ingress \
      --timeout=120s
  register: tunnel_ready
  ignore_errors: yes
  failed_when: false

# แสดงข้อมูลสำคัญ
- name: Get all services info
  ansible.builtin.shell: |
    echo "=== Nginx Ingress Services ==="
    k3s kubectl get svc -n skypilot-ingress
    echo ""
    echo "=== SkyPilot Services ==="
    k3s kubectl get svc -n skypilot
    echo ""
    echo "=== SkyPilot Ingress ==="
    k3s kubectl get ingress -n skypilot
    echo ""
    echo "=== SkyPilot Pods ==="
    k3s kubectl get pods -n skypilot
    echo ""
    echo "=== Cloudflare Tunnel Pods ==="
    k3s kubectl get pods -n skypilot-ingress -l app=cloudflare-tunnel
  register: all_resources

- name: Display all resources
  ansible.builtin.debug:
    var: all_resources.stdout_lines

- name: Create test connectivity script
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      echo "Testing connectivity chain..."
      echo ""
      
      # Get actual service names
      NGINX_SVC=$(k3s kubectl get svc -n skypilot-ingress -l app.kubernetes.io/component=controller -o jsonpath='{.items[0].metadata.name}')
      SKYPILOT_SVC=$(k3s kubectl get svc -n skypilot -o jsonpath='{.items[0].metadata.name}')
      
      echo "Nginx Service: $NGINX_SVC"
      echo "SkyPilot Service: $SKYPILOT_SVC"
      echo ""
      
      echo "1. Testing Nginx Ingress (should return nginx 404 or backend):"
      k3s kubectl run test-nginx --image=curlimages/curl --rm -i --restart=Never -- \
        curl -s -o /dev/null -w "HTTP %{http_code}\n" http://$NGINX_SVC.skypilot-ingress.svc.cluster.local -H "Host: {{ skypilot_domain }}"
      echo ""
      
      echo "2. Testing SkyPilot Service directly:"
      k3s kubectl run test-skypilot --image=curlimages/curl --rm -i --restart=Never -- \
        curl -s -o /dev/null -w "HTTP %{http_code}\n" http://$SKYPILOT_SVC.skypilot.svc.cluster.local
      echo ""
      
      echo "3. Ingress details:"
      k3s kubectl describe ingress -n skypilot
    dest: /tmp/test-skypilot-connectivity.sh
    mode: '0755'

- name: Copy verify installation script to master
  ansible.builtin.copy:
    src: verify-installation.sh
    dest: /tmp/verify-skypilot.sh
    mode: '0755'

- name: Display final instructions
  ansible.builtin.debug:
    msg: |
      ===================================================
      SkyPilot Node Setup Complete!
      ===================================================
      
      🌐 Access URL: https://{{ skypilot_domain }}
      
      📋 NEXT STEPS - Configure Cloudflare Tunnel:
      ===================================================
      
      1. ไปที่: https://one.dash.cloudflare.com/
      2. เลือก: Zero Trust -> Networks -> Tunnels
      3. หา tunnel: 04478da7-cb30-4f2d-8097-4aec084fc456
      4. คลิก "Configure" (หรือ 3 dots -> Configure)
      5. ไปที่แท็บ "Public Hostname"
      6. คลิก "Add a public hostname"
      7. กรอกข้อมูล:
         
         ┌─────────────────────────────────────────────────────┐
         │ Public hostname                                     │
         ├─────────────────────────────────────────────────────┤
         │ Subdomain: skypilot                                 │
         │ Domain: bell-lab.space                              │
         │ Path: (ปล่อยว่าง)                                  │
         │                                                     │
         │ Service                                             │
         │ ─────────────────────────────────────               │
         │ Type: HTTP                                          │
         │ URL: {{ nginx_service_name.stdout }}.skypilot-ingress.svc.cluster.local:80 │
         │                                                     │
         │ Additional application settings (Optional)          │
         │ ─────────────────────────────────────               │
         │ ☐ Enable TLS (ไม่ต้องติ๊ก - ใช้ HTTP ภายใน cluster)│
         └─────────────────────────────────────────────────────┘
      
      8. คลิก "Save hostname"
      
      ⏱️  รอประมาณ 30-60 วินาที แล้วทดสอบ:
      🌐 https://{{ skypilot_domain }}
      
      ===================================================
      🔍 Traffic Flow:
      ===================================================
      Internet (HTTPS)
        ↓
      Cloudflare Edge
        ↓
      Cloudflare Tunnel (in cluster)
        ↓ HTTP
      Nginx Ingress Controller ({{ nginx_service_name.stdout }})
        ↓
      SkyPilot API Service ({{ skypilot_svc_name.stdout }})
        ↓
      SkyPilot API Pod
      
      ===================================================
      🛠️  Troubleshooting Commands:
      ===================================================
      
      # ตรวจสอบ pods ทั้งหมด
      k3s kubectl get pods -n skypilot
      k3s kubectl get pods -n skypilot-ingress
      
      # ตรวจสอบ services
      k3s kubectl get svc -n skypilot
      k3s kubectl get svc -n skypilot-ingress
      
      # ตรวจสอบ ingress
      k3s kubectl get ingress -n skypilot
      k3s kubectl describe ingress -n skypilot
      
      # ตรวจสอบ logs
      k3s kubectl logs -n skypilot-ingress deployment/cloudflare-tunnel
      k3s kubectl logs -n skypilot-ingress -l app.kubernetes.io/component=controller
      k3s kubectl logs -n skypilot -l app.kubernetes.io/name=skypilot-api-server
      
      # ทดสอบภายใน cluster
      bash /tmp/test-skypilot-connectivity.sh
      
      ===================================================
