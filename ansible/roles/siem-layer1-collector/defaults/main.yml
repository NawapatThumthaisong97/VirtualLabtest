---
# Defaults for siem-layer1-collector role (Vector Agent + Falco modern_ebpf)
# Supports both K3s Worker Nodes and AWS EC2/SkyPilot AMI baking

vector_version: "0.42.0"
falco_version: "0.39.2"
falco_engine_kind: "modern_ebpf"
falco_local_webhook_port: 8687

# Central SIEM receiver over Tailscale VPN mesh (100.64.0.0/10 — no public port exposed)
siem_central_tailscale_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] | default('100.86.87.27') }}"
siem_central_nats_port: 4222
siem_central_http_port: 8000
siem_central_http_path: "/api/v1/logs"
siem_collector_token: "{{ lookup('env', 'SIEM_COLLECTOR_TOKEN') | default('vlab-tailscale-collector-secret', true) }}"

# Node & Provider Classification
vlab_provider: "{{ 'aws' if ('skypilot' in group_names or is_cloud | default(false)) else 'local_k3s' }}"
vlab_nat_subnet: "{{ host_nat_zone | default('192.168.1.0/24') }}"
tailscale_interface: "tailscale0"

# Log Collection Paths
squid_access_log_path: "/var/log/squid/access.log"
kyverno_log_path: "/var/log/kyverno/audit.log"
tailscale_log_path: "/var/log/tailscale/acl.log"
falco_alert_log_path: "/var/log/falco/falco-alerts.json"

# Zero-Trust Plane Separation Guarantee:
# NEVER mount or harvest student interactive pod stdout/stderr logs
forbidden_pod_logs_path: "/var/log/pods/*/*/*.log"
