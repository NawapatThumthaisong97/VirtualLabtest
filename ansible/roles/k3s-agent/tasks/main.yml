---
- name: Read node token from artifacts
  ansible.builtin.set_fact:
    k3s_token: "{{ lookup('file', playbook_dir + '/artifacts/node-token') }}"

- name: Get master node IP from inventory
  ansible.builtin.set_fact:
    k3s_master_ip: "{{ hostvars[groups['master'][0]]['ansible_host'] }}"

- name: Get registry-host IP from inventory
  ansible.builtin.set_fact:
    registry_ip: "{{ hostvars[groups['registry'][0]]['ansible_host'] }}"

# containerd ของ worker ต้องรู้ว่า registry เป็น HTTP ธรรมดา (ไม่มี TLS) ไม่งั้น pod ที่ SkyPilot/
# k8s สั่ง schedule มาลงเครื่องนี้จะดึง image ไม่ได้เลย 
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure containerd to trust the private registry as insecure
  ansible.builtin.copy:
    content: |
      mirrors:
        "{{ registry_ip }}:5001":
          endpoint:
            - "http://{{ registry_ip }}:5001"
      configs:
        "{{ registry_ip }}:5001":
          tls:
            insecure_skip_verify: true
    dest: /etc/rancher/k3s/registries.yaml
  register: registries_yaml

# CoreDNS (และ pod ที่ใช้ dnsPolicy Default) ถาม DNS ต่อตาม resolv.conf ของ node ซึ่ง systemd-resolved
# ใส่ DNS ของ router ทั้ง IPv4 และ IPv6 (fd17:…) — CoreDNS สุ่มเลือก ได้ตัว IPv6 ทีไร pod ไม่มี IPv6
# → "network is unreachable" → apt / curl ใน pod ได้ "Temporary failure resolving" เป็นพัก ๆ
# (lab K8s ผ่าน SkyPilot พัง 3 ครั้งใน 1 คืน 2026-10-20) ต่างจาก coredns-custom ที่กันแค่คำตอบ AAAA
# → ให้ k3s ใช้ resolv.conf ที่มีแค่ nameserver IPv4 (ดึงจากของ systemd ไม่ฮาร์ดโค้ด IP ของแต่ละที่)
- name: Collect IPv4 upstream DNS servers of this node
  ansible.builtin.shell: |
    set -o pipefail
    f=/run/systemd/resolve/resolv.conf
    [ -f "$f" ] || f=/etc/resolv.conf
    awk '$1 == "nameserver" && $2 ~ /^[0-9.]+$/ && $2 !~ /^127\./ {print $2}' "$f"
  args:
    executable: /bin/bash
  register: ipv4_dns
  changed_when: false
  check_mode: false   # อ่านอย่างเดียว ให้ --check เห็นค่าจริง

- name: Write IPv4-only resolv.conf for k3s
  ansible.builtin.copy:
    content: |
      # Ansible (role k3s-server / k3s-agent) — nameserver IPv4 เท่านั้น (pod ใน cluster ไม่มี IPv6) ดู role k3s
      {% for ns in (ipv4_dns.stdout_lines or ['1.1.1.1', '8.8.8.8']) %}
      nameserver {{ ns }}
      {% endfor %}
    dest: /etc/rancher/k3s/resolv.conf
    mode: "0644"
  register: k3s_resolv

- name: Point k3s at the IPv4-only resolv.conf
  ansible.builtin.copy:
    content: |
      # Ansible (role k3s-server / k3s-agent) — ดู task "Write IPv4-only resolv.conf for k3s"
      resolv-conf: /etc/rancher/k3s/resolv.conf
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  register: k3s_config

- name: Restart k3s-agent to apply registries.yaml (ถ้า config เปลี่ยนและ agent ติดตั้งไปแล้ว)
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when:
    - registries_yaml.changed or k3s_resolv.changed or k3s_config.changed
    - inventory_hostname not in groups['master']
  ignore_errors: true # ครั้งแรกสุด service ยังไม่มี ก็ข้ามไป (agent จะอ่านไฟล์นี้ตอนติดตั้งเองอยู่แล้ว)

- name: Install K3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      K3S_URL=https://{{ k3s_master_ip }}:{{ k3s_api_port }} \
      K3S_TOKEN={{ k3s_token }} \
      sh -s - agent \
      --node-ip {{ ansible_host }} \
      --flannel-iface {{ flannel_iface }}
  args:
    creates: /usr/local/bin/k3s-agent
  when: inventory_hostname not in groups['master']

#เช็กว่า host status ขึ้น ready หรือยัง
- name: Check current Ready status of this node in the cluster
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    k3s kubectl get nodes -o wide --no-headers | awk -v ip="{{ ansible_host }}" '$6==ip {print $2}'
  delegate_to: "{{ groups['master'][0] }}"
  vars:
    ansible_become: false
  changed_when: false
  register: node_status


- name: Wait for node to be ready (ข้ามถ้า Ready อยู่แล้ว)
  ansible.builtin.shell: |
    for i in {1..30}; do
      STATUS=$(k3s kubectl get nodes -o wide --no-headers | awk -v ip="{{ ansible_host }}" '$6==ip {print $2}')
      [ "$STATUS" = "Ready" ] && exit 0
      sleep 5
    done
    exit 1
  delegate_to: "{{ groups['master'][0] }}"
  vars:
    ansible_become: false  #อํานาจเยอะกว่า become=false!
  when: node_status.stdout != "Ready"
  retries: 3
  delay: 10
  register: node_ready
  until: node_ready.rc == 0

# ห้องแลปของเครื่องนี้ (คอม 1 เครื่อง = 1 worker) หน้า admin monitor จัดกลุ่มห้องจาก label นี้
# ใส่ vlab_room ต่อ host ใน inventory ไม่ใส่ = ไม่แตะ label (ห้อง unassigned) — docs/ADMIN_MONITOR.md
# ใช้ kubectl label ไม่ใช้ --node-label ของ k3s เพราะ k3s ใส่ label นั้นแค่ตอน node ลงทะเบียนครั้งแรก
- name: Label this node with its lab room (vlab/room)
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    node=$(k3s kubectl get nodes -o wide --no-headers | awk -v ip="{{ ansible_host }}" '$6==ip {print $1}')
    [ -n "$node" ] || { echo "node with IP {{ ansible_host }} not found" >&2; exit 1; }
    current=$(k3s kubectl get node "$node" -o jsonpath='{.metadata.labels.vlab/room}')
    [ "$current" = "{{ vlab_room }}" ] && exit 0
    k3s kubectl label node "$node" vlab/room="{{ vlab_room }}" --overwrite >/dev/null && echo changed
  args:
    executable: /bin/bash
  delegate_to: "{{ groups['master'][0] }}"
  vars:
    ansible_become: false
  register: room_label
  changed_when: "'changed' in room_label.stdout"
  when: vlab_room is defined
